name: Release (TestFlight)

# Builds the app and ships it to TestFlight using only an App Store Connect API
# key – no certificate or provisioning profile files. The archive is built
# unsigned and ad-hoc signed; `xcodebuild -exportArchive` then signs it with a
# cloud-managed Apple Distribution certificate (needs an *Admin* API key).
#
# Repository secrets used:
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   Issuer ID shown above the key list
#   ASC_KEY_P8      contents of AuthKey_<KEY_ID>.p8 (as-is, or base64)
# Optional repository variable:
#   BUNDLE_ID       defaults to com.<repo owner>.timetablestudio

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload to TestFlight (off = only build the signed IPA artifact)
        type: boolean
        default: true
      marketing_version:
        description: Version shown in TestFlight (empty = 1.0.0)
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign & upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: TimetableStudio
      APP_NAME: Timetable Studio
      BUNDLE_ID: ${{ vars.BUNDLE_ID || format('com.{0}.timetablestudio', github.repository_owner) }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
        run: |
          if [ -n "${XCODE_VERSION:-}" ] && [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          xcodebuild -version

      - name: Check secrets & write API key
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          if ! printf '%s' "$TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID should be the 10-character Team ID (e.g. AB12CD34EF), found ${#TEAM_ID} characters."
            exit 1
          fi

          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_$KEY_ID.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '\r\n ' | base64 --decode > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid private key. Paste the whole .p8 file including the BEGIN/END PRIVATE KEY lines."
            exit 1
          fi

          {
            echo "TEAM_ID=$TEAM_ID"
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER_ID=$ISSUER_ID"
            echo "KEY_FILE=$KEY_FILE"
          } >> "$GITHUB_ENV"

          {
            echo "### Release"
            echo "- Bundle ID: \`$BUNDLE_ID\` · Team: \`$TEAM_ID\` · Build: \`$BUILD_NUMBER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check API key, App ID & App Store Connect app
        run: ruby scripts/asc_preflight.rb "$KEY_FILE" "$KEY_ID" "$ISSUER_ID" "$BUNDLE_ID" "$APP_NAME" "$UPLOAD"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        env:
          MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${MARKETING_VERSION_INPUT:-}" ]; then
            EXTRA+=("MARKETING_VERSION=$MARKETING_VERSION_INPUT")
          fi
          xcodebuild \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            -quiet \
            archive

      - name: Ad-hoc sign archive
        run: sh scripts/adhoc_sign_archive.sh "$RUNNER_TEMP/$SCHEME.xcarchive" "$TEAM_ID" "$BUNDLE_ID"

      - name: Export signed IPA (cloud signing)
        run: |
          set -euo pipefail
          make_options() {
            local plist="$1" destination="$2"
            rm -f "$plist"
            plutil -create xml1 "$plist"
            plutil -insert method -string app-store-connect "$plist"
            plutil -insert teamID -string "$TEAM_ID" "$plist"
            plutil -insert signingStyle -string automatic "$plist"
            plutil -insert destination -string "$destination" "$plist"
            plutil -insert uploadSymbols -bool YES "$plist"
            plutil -insert manageAppVersionAndBuildNumber -bool NO "$plist"
          }
          make_options "$RUNNER_TEMP/ExportOptions.plist" export
          make_options "$RUNNER_TEMP/UploadOptions.plist" upload

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n 1)
          cp "$IPA" "$SCHEME-$BUILD_NUMBER.ipa"
          ls -lh "$SCHEME-$BUILD_NUMBER.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}-appstore-ipa
          path: ${{ env.SCHEME }}-*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "- ✅ Uploaded build \`$BUILD_NUMBER\`. It appears in App Store Connect → TestFlight after processing (usually 5–15 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
